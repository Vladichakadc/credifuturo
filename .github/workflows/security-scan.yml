name: Security checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * *'

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  audit-and-lint:
    name: npm audit + lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ["Credifuturo-Web/client", "Credifuturo-Web/server"]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install --no-audit
          else
            echo "No package.json - se omite instalacion"
          fi

      - name: Lint (solo si existe script lint)
        run: |
          if [ -f package.json ]; then
            npm run lint --if-present
          fi

      - name: npm audit (falla en high/critical)
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high
          else
            echo "No package.json - se omite npm audit"
          fi
